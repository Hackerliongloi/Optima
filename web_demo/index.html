<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iQOO AI Phone Doctor</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D0F12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Doctor">
    <link rel="apple-touch-icon" href="app_logo.png">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-viewport">
        <!-- Phone Frame Container -->
        <div class="phone-frame">
            <div class="phone-screen" id="appScreen">
                <!-- Main Content Area -->
                <div class="content-container" id="mainContent">
                    <!-- Dynamic screen content injected via JavaScript -->
                </div>

                <!-- 5-Tab Bottom Navigation Bar with Glowing Center AI Button -->
                <div class="bottom-nav">
                    <button class="nav-item active" data-tab="home">
                        <span class="nav-icon">🏠</span>
                        <span class="nav-label">Home</span>
                    </button>
                    <button class="nav-item" data-tab="diagnose">
                        <span class="nav-icon">🩺</span>
                        <span class="nav-label">Diagnose</span>
                    </button>
                    <button class="nav-item nav-item-ai" data-tab="chat">
                        <div class="ai-button-glow">
                            <img src="app_logo.png" alt="AI Doctor Logo" class="nav-ai-img">
                        </div>
                        <span class="nav-label">AI Doctor</span>
                    </button>
                    <button class="nav-item" data-tab="history">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">History</span>
                    </button>
                    <button class="nav-item" data-tab="profile">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-label">Profile</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Simulation Floating Control Panel -->
        <div class="judge-control-panel">
            <h3>🎮 SIMULATION CONTROL</h3>
            <p>Select a scenario to test multi-signal correlation:</p>
            <div class="scenario-buttons">
                <button class="btn-scenario active" data-scenario="BATTERY_DRAIN">
                    🔋 1. Battery Drain
                </button>
                <button class="btn-scenario" data-scenario="THERMAL_STRESS">
                    🌡️ 2. Thermal Stress
                </button>
                <button class="btn-scenario" data-scenario="STORAGE_PRESSURE">
                    💾 3. Storage Pressure
                </button>
                <button class="btn-scenario" data-scenario="GAMING_PERFORMANCE">
                    🎮 4. Gaming Performance
                </button>
            </div>
            <div class="gemini-key-box">
                <label for="geminiKey">Gemini API Key (Optional):</label>
                <input type="password" id="geminiKey" placeholder="Paste Gemini API Key...">
                <button id="saveKeyBtn">Save Key</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
